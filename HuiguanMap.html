<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huiguan in Sichuan</title>
  <style>
    h1 {
      font: bold 25px Arial, Helvetica, sans-serif;
      text-align: center;
      margin: 1%;
    }

    .map-choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      width: 90%;
      margin: 0 auto 8px;
    }

    .map-choices button {
      padding: 8px;
      border: 0;
      border-radius: 5px;
      background: #6b6b6b;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }

    .map-choices button:hover,
    .map-choices button[aria-pressed="true"] {
      background: #454545;
    }

    .map-choices button[aria-pressed="true"] {
      font-weight: 700;
    }

    .map-choices button:focus-visible {
      outline: 2px solid #242424;
      outline-offset: 2px;
    }

    #viewDiv {
      display: block;
      width: 90%;
      height: 550pt;
      margin: auto;
    }

    .map-instructions {
      box-sizing: border-box;
      width: min(300px, 65vw);
      padding: 10px;
      background: var(--calcite-color-foreground-1, white);
      color: var(--calcite-color-text-1, black);
    }
  </style>

  <link rel="stylesheet" href="https://js.arcgis.com/5.2/esri/themes/light/main.css" />
  <script>
    globalThis.esriConfig = {
      apiKey: "AAPTaQEQzNWZ0WEvEvKbqlg6rkg..gsvO727LwsNXqFt0JP8NvoSWy79pHRsSedPcdbmeXycD5QYxFkdAcq7s5JkWV34vC9U8G1DMUsrE1cmyakycmS5p8aZdCVWRKFwNLqL-oMgzveI3s9-ubiIR1BUfIaVflP6ElUBsCQgTe8PLTlDepO2Nn2p-VnVT6kZzz01ygw21kTHTc3tj5BvftC7merFVanwR1_HxznnKFLm5CaFLL4fbPww7trBNMXFKfZv1W_CwDMu63PN_gEqdrlzpP903HG0UqCVEF0eD57pbv5NsRT3W44mpbtiRWTXw6dTQpmbZX8mRHESz8NM439kpso2hYEEld5MgV0iZet4hMqQsNimzAT1_cwiX1Ncd"
    }
  </script>
  <script type="module" src="https://js.arcgis.com/5.2"></script>

  <script type="module">
    const [WebMap] = await $arcgis.import(["@arcgis/core/WebMap.js"]);
    await Promise.all([
      customElements.whenDefined("arcgis-map"),
      customElements.whenDefined("arcgis-popup")
    ]);

    const mapElement = document.querySelector("#viewDiv");
    const popup = document.querySelector("#prefecturePopup");
    const buttons = [...document.querySelectorAll(".map-choices button")];

    popup.dockOptions = {
      buttonEnabled: false,
      breakpoint: { width: 1200, height: 1200 },
      position: "top-left"
    };

    // Esri sample: https://developers.arcgis.com/javascript/latest/sample-code/webmap-swap/
    const webmaps = buttons.map((button) => new WebMap({
      portalItem: { id: button.dataset.itemId }
    }));

    let activeButton = buttons[0];
    mapElement.center = [104.838384, 30.158838];
    mapElement.map = webmaps[0];

    buttons.forEach((button, index) => {
      button.addEventListener("click", () => {
        if (button === activeButton) {
          return;
        }

        mapElement.closePopup();
        mapElement.map = webmaps[index];
        activeButton.setAttribute("aria-pressed", "false");
        button.setAttribute("aria-pressed", "true");
        activeButton = button;
      });
    });
  </script>
</head>

<body>
  <h1>Distribution of <em>Huiguan</em> in Sichuan</h1>

  <div class="map-choices" role="group" aria-label="Huiguan maps">
    <button type="button" data-item-id="f5d5f81f0c6a4748aa19b64dd756925c" aria-pressed="true" aria-controls="viewDiv"><span lang="zh-Hant">主要會館</span><br>Predominant</button>
    <button type="button" data-item-id="4522aa2ac2fe4a0db3f09f6c0ea00d03" aria-pressed="false" aria-controls="viewDiv"><span lang="zh-Hant">禹王宮</span><br>Yuwanggong</button>
    <button type="button" data-item-id="f82fcdf963094e51b2f8b536013e2133" aria-pressed="false" aria-controls="viewDiv"><span lang="zh-Hant">萬壽宮</span><br>Wanshougong</button>
    <button type="button" data-item-id="e501a89a6eaf4e3497906b73016cfd2a" aria-pressed="false" aria-controls="viewDiv"><span lang="zh-Hant">川主廟</span><br>Chuanzhumiao</button>
    <button type="button" data-item-id="612cb10b65ef4a70a1703c71bd47980d" aria-pressed="false" aria-controls="viewDiv"><span lang="zh-Hant">南華宮</span><br>Nanhuagong</button>
    <button type="button" data-item-id="a9a688b4a7b94b13804aa65d7b391221" aria-pressed="false" aria-controls="viewDiv"><span lang="zh-Hant">天后宮</span><br>Tianhougong</button>
    <button type="button" data-item-id="deb50a761219460591496a0b3a0750f3" aria-pressed="false" aria-controls="viewDiv"><span lang="zh-Hant">帝主宮</span><br>Dizhugong</button>
    <button type="button" data-item-id="3834b3c9f1e54fde9f5d4530109776d5" aria-pressed="false" aria-controls="viewDiv"><span lang="zh-Hant">關帝廟</span><br>Guandimiao</button>
  </div>

  <arcgis-map id="viewDiv" aria-label="Distribution of Huiguan in Sichuan">
    <arcgis-zoom slot="top-left"></arcgis-zoom>
    <arcgis-home slot="top-left"></arcgis-home>
    <arcgis-expand slot="top-left" expand-icon="question" expand-tooltip="How to use this map" collapse-tooltip="Hide map instructions" expanded>
      <div class="map-instructions">
        Choose a huiguan map above.<br>
        Zoom in to see prefecture names.<br>
        Select a prefecture to see more details.
      </div>
    </arcgis-expand>
    <arcgis-legend slot="top-right"></arcgis-legend>
    <arcgis-scale-bar slot="bottom-left" unit="metric"></arcgis-scale-bar>
    <arcgis-placement slot="bottom-right">
      <arcgis-attribution></arcgis-attribution>
    </arcgis-placement>
    <arcgis-popup id="prefecturePopup" slot="popup"></arcgis-popup>
  </arcgis-map>
</body>

</html>
