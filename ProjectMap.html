<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Sichuan Religions Project Map</title>
  <style>
    #viewDiv {
      padding: 0;
      margin: auto;
      height: 550pt;
      width: 90%;
      position: relative;
    }

    html.is-embedded .footer {
      display: none;
    }
  </style>

  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add("is-embedded");
    }
  </script>



  <link rel="stylesheet" href="https://js.arcgis.com/5.2/esri/themes/light/main.css" />
  <script>
    globalThis.esriConfig = {
      apiKey: "AAPTaQEQzNWZ0WEvEvKbqlg6rkg..gsvO727LwsNXqFt0JP8NvoSWy79pHRsSedPcdbmeXycD5QYxFkdAcq7s5JkWV34vC9U8G1DMUsrE1cmyakycmS5p8aZdCVWRKFwNLqL-oMgzveI3s9-ubiIR1BUfIaVflP6ElUBsCQgTe8PLTlDepO2Nn2p-VnVT6kZzz01ygw21kTHTc3tj5BvftC7merFVanwR1_HxznnKFLm5CaFLL4fbPww7trBNMXFKfZv1W_CwDMu63PN_gEqdrlzpP903HG0UqCVEF0eD57pbv5NsRT3W44mpbtiRWTXw6dTQpmbZX8mRHESz8NM439kpso2hYEEld5MgV0iZet4hMqQsNimzAT1_cwiX1Ncd"
    }
  </script>
  <script type="module" src="https://js.arcgis.com/5.2"></script>


  <script type="module">
    const [WebMap, MapView, LayerList] = await $arcgis.import([
      "@arcgis/core/WebMap.js",
      "@arcgis/core/views/MapView.js",
      "@arcgis/core/widgets/LayerList.js"
    ]);

    const webmap = new WebMap({
      portalItem: {
        id: "7ffa8f2449824e7bb4003e409894f9d9"
      }
    });

    const view = new MapView({
      container: "viewDiv",
      map: webmap
    });

    //LayerList
    const layerList = new LayerList({
      view
    });
    view.ui.add(layerList, "bottom-right");


    //Scale bar
    await customElements.whenDefined("arcgis-scale-bar");

    const scaleBar = document.createElement("arcgis-scale-bar");
    scaleBar.view = view;                  // Use this map's zoom and scale.
    scaleBar.unit = "metric";              // Show meters or kilometers.
    view.ui.add(scaleBar, "bottom-left");  // Position it on the map.


    //Expand
    await customElements.whenDefined("arcgis-expand");

    const instructionsExpand = document.createElement("arcgis-expand");
    instructionsExpand.view = view;
    instructionsExpand.expandIcon = "question";
    instructionsExpand.expandTooltip = "How to use this map";
    instructionsExpand.expanded = true;
    instructionsExpand.innerHTML = `
  <div style="width: 300px; padding: 10px; background-color: white">
    <b>Click</b> the upper-right panel to show or hide sites by type.<br>
    <b>Zoom in</b> to see the full site names.<br>
    <b>Click</b> a site marker to see more information.  </div>
`;
    view.ui.add(instructionsExpand, "top-left");
  </script>
</head>

<body>
  <h1 style="font-size: 25px;position: relative;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;margin:1%">Sichuan Religion Project Map</h1>

  <div id="viewDiv" style="position:relative"></div>

  <div class="footer" style="text-align:center">
    <p style="font-size: small;">Projrect created and maintained by <a href="https://github.com/ywzhou997/">Yuwei
        Zhou</a></p>
  </div>

</body>

</html>
